# Site settings
title: "Just another random webpage"
name: "Just another random webpage"
author: "Tiago Ferreira"
email: "tiagoferreira@fpce.up.pt"
description: "This is my personal webpage! Stay tuned for releases with new data analysis tutorials and code."
github_username: "tiagodsferreira"

# URL settings
url: "https://tiagodsferreira.github.io"  # the GitHub Pages domain (no trailing slash)
baseurl: "/JARW"                          # the repository name (with leading slash)

# Plugins
plugins:
  - jekyll-feed

# Feed settings
feed:
  path: feed.xml

# Build settings
theme: minima
markdown: kramdown

# Performance optimizations
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .git/
  - .gitignore

# Limit posts in development
limit_posts: 0  # 0 means no limit; set to a number during development for faster builds

# Incremental build (faster rebuilds during development)
incremental: true
