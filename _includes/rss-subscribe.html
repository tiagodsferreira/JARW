<!-- RSS subscription button - reusable component -->
<div class="rss-subscribe">
  <hr>
  <p><strong>Stay updated with new posts:</strong></p>
  <a href="{{ '/feed.xml' | relative_url }}" target="_blank" style="
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 8px;
      background-color:#ff6600;
      color:white;
      font-weight:bold;
      border-radius:3px;
      text-decoration:none;
      font-size:0.85em;
  ">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/Feed-icon.svg" alt="RSS" width="14" height="14"> RSS feed
  </a>
  <p style="font-size:0.9em;color:#666;margin-top:8px;"><em>Tip: Open this link in your preferred RSS reader or add the URL to your RSS-capable software. RSS is anonymous — no personal data is tracked.</em></p>
</div>
